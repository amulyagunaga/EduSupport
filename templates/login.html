<!DOCTYPE html>
<html>
<head>

    <title>EduSupport Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <h2 class="text-center mb-2">
                        EduSupport
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Student Support & Ticket Management
                    </p>


                    {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                    {% endif %}


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Login

                        </button>

                    </form>


                    <hr>


                    <div class="small text-muted">

                        <strong>Demo Accounts</strong>

                        <br><br>

                        Student:
                        student@college.com /
                        student123

                        <br>

                        Staff:
                        staff@college.com /
                        staff123

                        <br>

                        Admin:
                        admin@college.com /
                        admin123

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
