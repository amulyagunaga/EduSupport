<!DOCTYPE html>
<html>

<head>

    <title>Create Ticket</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand">
            EduSupport
        </span>

        <a
            href="{{ url_for('dashboard') }}"
            class="btn btn-light btn-sm">

            Back to Dashboard

        </a>

    </div>

</nav>



<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        Create Support Ticket
                    </h3>


                    <form method="POST">


                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                name="category"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Fees">
                                    Fees
                                </option>

                                <option value="Attendance">
                                    Attendance
                                </option>

                                <option value="ID Card">
                                    ID Card
                                </option>

                                <option value="Certificate">
                                    Certificate
                                </option>

                                <option value="Documents">
                                    Documents
                                </option>

                                <option value="Exam">
                                    Exam
                                </option>

                                <option value="Hostel">
                                    Hostel
                                </option>

                                <option value="Transport">
                                    Transport
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            <input
                                type="text"
                                name="subject"
                                class="form-control"
                                placeholder="Enter your issue"
                                required>

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                placeholder="Explain your issue"
                                required></textarea>

                        </div>



                        <div class="mb-4">

                            <label class="form-label">
                                Priority
                            </label>

                            <select
                                name="priority"
                                class="form-select"
                                required>

                                <option value="LOW">
                                    Low
                                </option>

                                <option value="MEDIUM" selected>
                                    Medium
                                </option>

                                <option value="HIGH">
                                    High
                                </option>

                                <option value="CRITICAL">
                                    Critical
                                </option>

                            </select>

                        </div>



                        <button
                            type="submit"
                            class="btn btn-primary">

                            Submit Ticket

                        </button>


                        <a
                            href="{{ url_for('dashboard') }}"
                            class="btn btn-secondary">

                            Cancel

                        </a>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
